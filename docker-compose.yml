services:
  postgres:
    image: postgres:16-alpine
    container_name: tutor-platform-postgres
    environment:
      POSTGRES_DB: tutor_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tutor_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: tutor-platform-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tutor_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: change-me-to-long-random-secret-change-before-production
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      UPLOAD_PUBLIC_BASE_URL: http://localhost:8080/api/v1/files
      PAYMENT_MODE: sandbox
      ENABLED_GATEWAYS: bank_qr,vnpay,momo,payos,stripe
      DEFAULT_GATEWAY: bank_qr
      FRONTEND_BASE_URL: http://localhost:3000
      AUTH_EXPOSE_DEV_TOKENS: false
      COMMISSION_RATE: 0.15
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    image: node:22-alpine
    container_name: tutor-platform-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
